[package]
name = "ps5-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A Rust-first PC companion CLI for a planned PS5 transfer workflow"

[dependencies]
fs2 = "=0.4.3"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
sha2 = "=0.10.8"

[lib]
name = "ps5_companion"
path = "src/lib.rs"
